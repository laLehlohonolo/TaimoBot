name: TaimoBot application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run ten copy-recovery checks sequentially
        run: python scripts/run_copy_recovery_group.py
      - name: Run ten copy-safety checks sequentially
        run: python scripts/run_copy_safety_group.py
      - name: Run ten position-group accounting checks sequentially
        run: python scripts/run_position_group_accounting.py
      - name: Run ten close-cost ledger checks sequentially
        run: python scripts/run_close_cost_ledger_group.py
      - name: Run ten copied-ledger reconciliation checks sequentially
        run: python scripts/run_copied_ledger_reconciliation.py
      - name: Run ten copy lifecycle close-race checks sequentially
        run: python scripts/run_copy_lifecycle_close_races.py
      - name: Run ten multi-follower close reconciliation checks sequentially
        run: python scripts/run_multi_follower_close_reconciliation.py
      - name: Run ten multi-follower close rollback checks sequentially
        run: python scripts/run_multi_follower_close_rollback.py
      - name: Run ten SQLite corruption recovery checks sequentially
        run: python scripts/run_sqlite_corruption_recovery.py
      - name: Run ten restore candidate identity checks sequentially
        run: python scripts/run_restore_candidate_identity.py
      - name: Run ten restore approval race checks sequentially
        run: python scripts/run_restore_approval_race_group.py
      - name: Run ten locked restore lifecycle checks sequentially
        run: python scripts/run_locked_restore_lifecycle.py
      - name: Run ten restore journal identity checks sequentially
        run: python scripts/run_restore_journal_identity.py
      - name: Run ten restore interruption recovery checks sequentially
        run: python scripts/run_restore_interruption_recovery.py
      - name: Run ten restore interruption journal consistency checks sequentially
        run: python scripts/run_restore_interruption_journal_consistency.py
      - name: Run ten restore lock cleanup checks sequentially
        run: python scripts/run_restore_lock_cleanup_group.py
      - name: Run ten restore marker crash-boundary checks sequentially
        run: python scripts/run_restore_marker_crash_boundaries.py
      - name: Run ten partial restore marker recovery checks sequentially
        run: python scripts/run_restore_partial_marker_recovery.py
      - name: Run ten restore lock release retry checks sequentially
        run: python scripts/run_restore_lock_release_retry.py
      - name: Run ten restore recovery crash durability checks sequentially
        run: python scripts/run_restore_recovery_crash_durability.py
      - name: Run ten restore process-death recovery checks sequentially
        run: python scripts/run_restore_process_death_recovery.py
      - name: Run ten restore PID identity checks sequentially
        run: python scripts/run_restore_pid_identity.py
      - name: Run ten concurrent restore audit append checks sequentially
        run: python scripts/run_restore_concurrent_audit.py
      - name: Run ten restore audit append crash-boundary checks sequentially
        run: python scripts/run_restore_audit_append_crash_boundaries.py
      - name: Run ten restore audit fsync durability checks sequentially
        run: python scripts/run_restore_audit_fsync_durability.py
      - name: Run ten read-only restore audit diagnostic checks sequentially
        run: python scripts/run_restore_audit_diagnostics.py
      - name: Run ten restore operator reconciliation checks sequentially
        run: python scripts/run_restore_operator_reconciliation.py
      - name: Run ten restore artifact evidence cross-checks sequentially
        run: python scripts/run_restore_artifact_evidence_cross_checks.py
      - name: Run ten backup retention lifecycle checks sequentially
        run: python scripts/run_backup_retention_lifecycle.py
      - name: Run twenty recovery artifact inventory checks sequentially
        run: python scripts/run_recovery_artifact_inventory.py
      - name: Run twenty recovery inventory API checks sequentially
        run: python scripts/run_recovery_inventory_api.py
      - name: Run twenty real-artifact recovery inventory API checks sequentially
        run: python scripts/run_recovery_inventory_api_real_artifacts.py
      - name: Run twenty recovery inventory filesystem race checks sequentially
        run: python scripts/run_recovery_inventory_filesystem_races.py
      - name: Run twenty recovery inventory metadata race checks sequentially
        run: python scripts/run_recovery_inventory_metadata_races.py
      - name: Run twenty recovery inventory restore-journal race checks sequentially
        run: python scripts/run_recovery_inventory_journal_races.py
      - name: Run twenty recovery inventory database identity race checks sequentially
        run: python scripts/run_recovery_inventory_database_identity_races.py
      - name: Run twenty recovery inventory postcheck metadata race checks sequentially
        run: python scripts/run_recovery_inventory_postcheck_metadata_races.py
      - name: Run twenty combined recovery inventory final-window race checks sequentially
        run: python scripts/run_recovery_inventory_combined_final_window_races.py
      - name: Run twenty terminal recovery inventory consistency-fence race checks sequentially
        run: python scripts/run_recovery_inventory_terminal_fence_races.py
      - name: Run twenty recovery inventory final consistency fence checks sequentially
        run: python scripts/run_recovery_inventory_final_consistency_fence.py
      - name: Run twenty recovery inventory hash-to-SQLite-open race checks sequentially
        run: python scripts/run_recovery_inventory_hash_to_sqlite_open_races.py
      - name: Run twenty recovery artifact streaming hash race checks sequentially
        run: python scripts/run_recovery_artifact_streaming_hash_races.py
      - name: Run twenty transiently restored artifact mutation race checks sequentially
        run: python scripts/run_recovery_artifact_restored_mutation_races.py
      - name: Run twenty managed-directory metadata race checks sequentially
        working-directory: backend
        run: python scripts/run_recovery_inventory_directory_metadata_races.py
      - name: Run twenty post-terminal metadata filesystem race checks sequentially
        run: python scripts/run_recovery_inventory_post_terminal_metadata_fs_races.py
      - name: Run twenty post-digest-return recovery inventory race checks sequentially
        run: python scripts/run_recovery_inventory_post_digest_return_races.py
      - name: Run twenty restore-candidate source path race checks sequentially
        run: python scripts/run_restore_candidate_source_races.py
      - name: Run twenty restore-lock unknown-state checks sequentially
        run: python scripts/run_restore_lock_unknown_state.py
      - name: Run twenty locked-preflight final lock ownership checks sequentially
        run: python scripts/run_locked_preflight_final_lock_races.py
      - name: Run twenty approved restore preflight final-fence checks sequentially
        run: python scripts/run_approved_preflight_final_fence.py
      - name: Run twenty restore approval transaction race checks sequentially
        run: python scripts/run_restore_approval_transaction_races.py
      - name: Run twenty live database symlink preflight checks sequentially
        run: python scripts/run_live_database_symlink_preflight.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Verify FastAPI application
        run: python -c "from app.main import app; print(app.title)"
      - name: Start FastAPI and test health endpoint
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/taimobot-api.log 2>&1 &
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/taimobot-api.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Get repository code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python for API integration
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build React frontend
        run: npm run build
      - name: Start isolated paper API
        run: |
          cd ../backend
          TAIMOBOT_DB_PATH=/tmp/taimobot-integration.db uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/taimobot-integration-api.log 2>&1 &
      - name: Start Vite development proxy
        run: npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/taimobot-vite.log 2>&1 &
      - name: Test real frontend-to-backend HTTP flow
        run: |
          node scripts/integration-smoke.mjs || {
            echo "----- FastAPI log -----"
            cat /tmp/taimobot-integration-api.log
            echo "----- Vite log -----"
            cat /tmp/taimobot-vite.log
            exit 1
          }
